<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title }} - {{ site.title }}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/assets/css/main.css">
  </head>
  <body class="container-fluid bg-body-secondary p-3 vh-100">
    <div class="row gy-3 h-100">
      <div class="col-12 col-lg-3 col-xl-2">
        <div class="text-bg-primary rounded raised p-1 p-lg-3">
          HEADER
        </div>
        <div class="bg-body rounded raised p-1 p-lg-3 mt-lg-3">
          NAV
        </div>
      </div>
      <div class="col-12 col-lg-9 col-xl-10">
        <div class="bg-body rounded raised p-1 p-lg-3">
          {{ content }}
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
