<!doctype html>

<html lang="{{ site.lang | default: "en-US" }}" data-bs-theme="light">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title }} - {{ site.title }}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/assets/css/main.css">
  </head>

  <body class="d-flex flex-column flex-lg-row gap-3 p-3 vh-100 bg-body-secondary">
    <div class="d-flex flex-column gap-3">
      <div class="rounded p-3 text-bg-primary d-flex gap-3 align-items-center">
        <img src="/favicon.ico" width="30" alt="Logo" />
        <h5 class="mb-0">bingusdingus</h5>
      </div>
      <nav class="d-none d-lg-flex flex-column flex-grow-1 gap-2 rounded raised p-3 pb-0">
        <a href="/" class="link">Home</a>
        <a href="/fight-stick-visualizer" class="link">Fight Stick Visualizer</a>
        <a href="/tournament-overlay" class="link">Tournament Overlay</a>
        <div class="flex-grow-1"></div>
        <div class="d-flex flex-row justify-content-around">
          <button id="switch-theme" type="button" class="btn btn-link p-3" title="Switch Theme">
            <i id="switch-theme-icon" class="bi bi-moon-fill"></i>
          </button>
          <button type="button" class="btn btn-link p-3" title="About this site">
            <i class="bi bi-question-circle"></i>
          </button>
        </div>
      </nav>
    </div>
    <div class="flex-grow-1 rounded raised py-3" style="min-height: 0;">
      <main class="mh-100 overflow-auto container-fluid px-3">
        {{ content }}
      </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
